<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Constante"><title>Constante</title><style>:root{--b:#f4f4f1;--c:#fff;--t:#151515;--m:#70706b;--l:#deded8}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(88px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.ey{font-size:11px;font-weight:800;letter-spacing:.15em;color:var(--m)}h1{font-size:34px;margin:3px 0;letter-spacing:-.04em}h2{font-size:23px;margin:6px 0}.card{background:var(--c);border:1px solid var(--l);border-radius:24px;padding:20px;margin:0 0 14px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{background:#ecece8;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800}.hero{font-size:48px;font-weight:900;letter-spacing:-.06em;margin:14px 0 3px}.muted{color:var(--m)}button,select{font:inherit}.primary,.secondary,.mode{border:0;border-radius:15px;padding:14px;font-weight:800}.primary{width:100%;background:#111;color:#fff}.secondary{width:100%;background:#ecece8}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}.mode{padding:10px 4px;background:#fff;border:1px solid var(--l);font-size:12px}.mode.on{background:#111;color:#fff}.ex{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--l)}.ex:last-child{border:0}.ex b{font-size:17px}.dose{font-size:20px;font-weight:900}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(250,250,248,.95);backdrop-filter:blur(18px);border-top:1px solid var(--l);padding:9px 6px calc(9px + env(safe-area-inset-bottom))}.tab{border:0;background:transparent;color:var(--m);font-size:11px;font-weight:800;padding:7px}.tab.on{color:#111}.view{display:none}.view.on{display:block}.work{text-align:center;padding:32px 20px}.big{font-size:70px;font-weight:900;letter-spacing:-.06em;margin:14px 0}.bar{height:8px;background:#ecece8;border-radius:99px;overflow:hidden;margin:12px 0 18px}.bar i{display:block;height:100%;background:#111}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#ecece8;border-radius:17px;padding:15px}.stat b{display:block;font-size:25px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{aspect-ratio:1;border-radius:10px;background:#ecece8;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--m)}.day.done{background:#111;color:#fff}.day.min{background:#fff;color:#111;outline:2px solid #111;outline-offset:-2px}svg{width:100%;height:190px}.axis{stroke:#ddd}.curve{fill:none;stroke:#111;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dot{fill:#111}.chips{display:flex;gap:7px;overflow:auto;margin:10px 0}.chip{white-space:nowrap;border:1px solid var(--l);background:#fff;border-radius:99px;padding:8px 11px;font-size:12px;font-weight:800}.chip.on{background:#111;color:#fff}.feedback{display:grid;gap:8px}.feedback button{border:1px solid var(--l);background:#fff;border-radius:14px;padding:13px;font-weight:800}dialog{border:0;border-radius:24px;padding:22px;width:min(92vw,440px)}dialog::backdrop{background:#0006}select{width:100%;padding:13px;border:1px solid var(--l);border-radius:14px;background:#fff}</style></head><body><div class="app"><header><div><div class="ey">CONSTANTE • V1</div><h1 id="title">Aujourd’hui</h1></div></header><main><section id="today" class="view on"></section><section id="work" class="view"></section><section id="progress" class="view"></section><section id="history" class="view"></section><section id="settings" class="view"></section></main></div><nav class="tabs"><button class="tab on" data-v="today">Aujourd’hui</button><button class="tab" data-v="progress">Progression</button><button class="tab" data-v="history">Historique</button><button class="tab" data-v="settings">Réglages</button></nav><dialog id="dlg"><div class="ey">SÉANCE TERMINÉE</div><h2>Comment c’était ?</h2><p class="muted">Ton ressenti ajuste progressivement les prochaines séances.</p><div class="feedback"><button data-f="2">Très facile</button><button data-f="1">Facile</button><button data-f="0">Bien</button><button data-f="-1">Difficile</button><button data-f="-2">Trop difficile</button></div></dialog><script>const META={push:{n:'Pompes',u:'rép.',base:1,step:1},squat:{n:'Squats',u:'rép.',base:2,step:1},plank:{n:'Gainage',u:'sec',base:5,step:5},burpee:{n:'Burpees',u:'rép.',base:1,step:1},row:{n:'Rameur',u:'min',base:2,step:1}};const DEF=()=>({start:new Date().toISOString(),target:3,rower:true,scores:{push:{a:1,s:0},squat:{a:2,s:0},plank:{a:5,s:0},burpee:{a:1,s:0},row:{a:2,s:0}},sessions:[]});let S;try{S=JSON.parse(localStorage.constante||'null')||DEF()}catch(e){S=DEF()}let mode='normal',W=null,idx=0;const save=()=>localStorage.constante=JSON.stringify(S);const fac=m=>({minimum:.3,short:.55,normal:1,plus:1.25}[m]);function dose(k,m=mode){let v=S.scores[k].a*fac(m);if(k==='plank')return Math.max(5,Math.round(v/5)*5);return Math.max(1,Math.round(v))}function exercises(m=mode){let ks=['push','squat','plank','burpee'];if(S.rower&&(m==='plus'||S.sessions.length>=8))ks.push('row');return ks.map(k=>({k,n:META[k].n,u:META[k].u,d:dose(k,m)}))}function weekCount(){let d=new Date(),x=(d.getDay()+6)%7,start=new Date(d);start.setHours(0,0,0,0);start.setDate(d.getDate()-x);return S.sessions.filter(s=>new Date(s.date)>=start).length}function cons(days){let cut=Date.now()-days*86400000,n=S.sessions.filter(s=>new Date(s.date).getTime()>=cut).length,exp=S.target*days/7;return Math.min(100,Math.round(n/Math.max(1,exp)*100))}function est(m){let sec=20;exercises(m).forEach(e=>sec+=e.k==='row'?e.d*60:e.k==='plank'?e.d+20:e.d*4+20);return Math.max(1,Math.ceil(sec/60))}function today(){let done=weekCount(),left=Math.max(0,S.target-done),ex=exercises();document.querySelector('#today').innerHTML=`<div class="card"><div class="row"><span class="pill">${done}/${S.target} cette semaine</span><span class="pill">${cons(30)}% constance</span></div><div class="hero">${left?left+' séance'+(left>1?'s':''):'Objectif atteint'}</div><div class="muted">${left?'pour valider ta semaine.':'La séance bonus reste facultative.'}</div></div><div class="card"><div class="row"><div><div class="ey">SÉANCE DU JOUR</div><h2>${est(mode)} min environ</h2></div><span class="pill">${mode==='minimum'?'Minimum':mode==='short'?'3 min':mode==='plus'?'Plus':'Normale'}</span></div><div class="modes">${['minimum','short','normal','plus'].map(m=>`<button class="mode ${m===mode?'on':''}" data-m="${m}">${m==='minimum'?'Minimum':m==='short'?'3 min':m==='normal'?'Normal':'Plus'}</button>`).join('')}</div>${ex.map(e=>`<div class="ex"><div><b>${e.n}</b><div class="muted">progressif</div></div><div class="dose">${e.d} ${e.u}</div></div>`).join('')}<button id="start" class="primary" style="margin-top:15px">Démarrer</button><p class="muted" style="font-size:12px">Le mode Minimum compte. Pas de rattrapage : on continue simplement à la séance suivante.</p></div><div class="card"><div class="ey">DEPUIS LE PREMIER JOUR</div><div class="grid" style="margin-top:12px"><div class="stat"><b>${S.sessions.length}</b>Séances</div><div class="stat"><b>${Math.max(1,Math.round((Date.now()-new Date(S.start))/86400000))}</b>Jours de parcours</div></div></div>`;document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;today()});document.querySelector('#start').onclick=start}function start(){W={date:new Date().toISOString(),mode,ex:exercises()};idx=0;show('work');renderWork()}function renderWork(){let e=W.ex[idx];document.querySelector('#work').innerHTML=`<div class="bar"><i style="width:${idx/W.ex.length*100}%"></i></div><div class="card work"><div class="muted">${e.n}</div><div class="big">${e.d}</div><div class="muted">${e.u}</div></div><button class="primary" id="next">${idx===W.ex.length-1?'Terminer':'Fait — suivant'}</button><button class="secondary" id="hard" style="margin-top:8px">Trop difficile pour cet exercice</button>`;document.querySelector('#next').onclick=next;document.querySelector('#hard').onclick=()=>{e.hard=true;next()}}function next(){if(idx<W.ex.length-1){idx++;renderWork()}else document.querySelector('#dlg').showModal()}document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{let f=+b.dataset.f;W.ex.forEach(e=>{let sc=S.scores[e.k],sig=e.hard?-2:f;sc.s=(sc.s||0)+sig;if(sc.s>=3){sc.a+=META[e.k].step;sc.s=0}else if(sc.s<=-3){sc.a=Math.max(META[e.k].base,sc.a-META[e.k].step);sc.s=0}});W.feedback=f;S.sessions.push(W);save();document.querySelector('#dlg').close();show('progress');render()});function hist(k){let a=[META[k].base];S.sessions.forEach(s=>{let e=s.ex.find(x=>x.k===k);if(e)a.push(e.d)});return a}function chart(vals){let w=500,h=180,p=22,max=Math.max(1,...vals),x=i=>p+i/Math.max(1,vals.length-1)*(w-2*p),y=v=>h-p-v/max*(h-2*p),pts=vals.map((v,i)=>x(i)+','+y(v)).join(' ');return `<svg viewBox="0 0 ${w} ${h}"><line class="axis" x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}"/><polyline class="curve" points="${pts}"/>${vals.map((v,i)=>`<circle class="dot" cx="${x(i)}" cy="${y(v)}" r="3"/>`).join('')}</svg>`}let ck='push';function progress(){document.querySelector('#progress').innerHTML=`<div class="card"><div class="ey">D’OÙ TU VIENS</div><div class="hero">${cons(90)}%</div><div class="muted">de constance sur 90 jours</div></div><div class="card"><div class="ey">DÉPART → AUJOURD’HUI</div>${['push','squat','plank','burpee'].map(k=>`<div class="ex"><b>${META[k].n}</b><div class="dose">${META[k].base} → ${S.scores[k].a}</div></div>`).join('')}</div><div class="card"><div class="ey">ÉVOLUTION RÉELLE</div><div class="chips">${['push','squat','plank','burpee'].map(k=>`<button class="chip ${k===ck?'on':''}" data-c="${k}">${META[k].n}</button>`).join('')}</div><div id="chart">${chart(hist(ck))}</div><p class="muted" style="font-size:12px">Les baisses restent visibles : la tendance compte davantage qu’une ligne parfaite.</p></div>`;document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ck=b.dataset.c;progress()})}function history(){let days=[];for(let i=27;i>=0;i--){let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);let s=S.sessions.find(x=>new Date(x.date).toDateString()===d.toDateString());days.push({d:d.getDate(),s})}document.querySelector('#history').innerHTML=`<div class="card"><div class="ey">28 DERNIERS JOURS</div><div class="calendar" style="margin-top:13px">${days.map(x=>`<div class="day ${x.s?(x.s.mode==='minimum'?'min':'done'):''}">${x.d}</div>`).join('')}</div></div><div class="card"><div class="ey">DERNIÈRES SÉANCES</div>${[...S.sessions].reverse().slice(0,12).map(s=>`<div class="ex"><div><b>${new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'short'}).format(new Date(s.date))}</b><div class="muted">${s.mode}</div></div><span class="pill">${s.ex.length} ex.</span></div>`).join('')||'<p class="muted">Aucune séance pour le moment.</p>'}</div>`}function settings(){document.querySelector('#settings').innerHTML=`<div class="card"><div class="ey">OBJECTIF HEBDOMADAIRE</div><select id="target" style="margin:10px 0 18px">${[2,3,4,5].map(n=>`<option ${S.target===n?'selected':''}>${n}</option>`).join('')}</select><div class="ey">RAMEUR</div><select id="rower" style="margin:10px 0 18px"><option value="1" ${S.rower?'selected':''}>Disponible</option><option value="0" ${!S.rower?'selected':''}>Ne pas utiliser</option></select><button class="primary" id="save">Enregistrer</button></div><div class="card"><div class="ey">PHILOSOPHIE</div><h2>Constante avant intensité.</h2><p class="muted">Minimum accepté. Pas de rattrapage. Progression réversible. Tes données restent dans Safari sur cet iPhone.</p></div><button class="secondary" id="reset">Réinitialiser les données</button>`;document.querySelector('#save').onclick=()=>{S.target=+document.querySelector('#target').value;S.rower=document.querySelector('#rower').value==='1';save();show('today');render()};document.querySelector('#reset').onclick=()=>{if(confirm('Réinitialiser toutes les données ?')){S=DEF();save();render()}}}function render(){today();progress();history();settings()}function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.v===v));document.querySelector('#title').textContent={today:'Aujourd’hui',work:'Séance',progress:'Progression',history:'Historique',settings:'Réglages'}[v]}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.v));render();</script></body></html>
